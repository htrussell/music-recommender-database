<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Current Music Catalog ERD</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c252b;
      background: #f5f7f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1240px, calc(100% - 2rem)); margin: 0 auto; padding: 1.5rem 0 2rem; }
    .page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1rem; margin-bottom: 1rem; }
    h1 { margin: 0; color: #183b4b; font-size: clamp(1.45rem, 3vw, 2rem); }
    .page-head p { flex-basis: 100%; margin: -.3rem 0 0; color: #50616b; line-height: 1.5; }
    .page-head nav { display: flex; flex-wrap: wrap; gap: .5rem; }
    .page-head a, .page-head button { padding: .55rem .8rem; border: 1px solid #a9c6cd; border-radius: 6px; color: #164b61; background: #e8f3f5; font: inherit; font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer; }
    .page-head a:hover, .page-head a:focus-visible, .page-head button:hover, .page-head button:focus-visible { background: #dcecef; }
    .notice { margin: 0 0 .8rem; padding: .65rem .8rem; border-left: 4px solid #bf8840; color: #5b482d; background: #fff7e9; font-size: .9rem; line-height: 1.45; }
    .diagram-frame { overflow-x: auto; border: 1px solid #d0d9dd; border-radius: 8px; background: #fff; box-shadow: 0 3px 12px #17324212; }
    svg { display: block; width: 100%; height: auto; }
    .wire { fill: none; stroke: #273943; stroke-width: 2; stroke-linejoin: round; }
    .wire.external { stroke-dasharray: 7 5; }
    .glyph { fill: #fff; stroke: #17252c; stroke-width: 2; }
    .glyph-line { fill: none; stroke: #17252c; stroke-width: 2; stroke-linecap: round; }
    .legend-edge { fill: none; stroke: #17252c; stroke-width: 2; }
    .entity-box { fill: #fff; stroke: #17252c; stroke-width: 2; }
    .entity-head { stroke: #17252c; stroke-width: 2; }
    .entity-title { fill: #14252d; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .field { fill: #1b252b; }
    .kind-main .entity-head, .kind-user .entity-head { fill: #d8eceb; }
    .kind-extension .entity-head, .kind-playlist .entity-head { fill: #e4ecd9; }
    .kind-bridge .entity-head, .kind-transcript .entity-head, .kind-event .entity-head { fill: #dfe8f2; }
    .kind-consent .entity-head, .kind-provenance .entity-head { fill: #f2e6ce; }
    .kind-taste .entity-head, .kind-memory .entity-head { fill: #e5e0f2; }
    .kind-external .entity-box { stroke-dasharray: 7 5; fill: #fbfcfc; }
    .kind-external .entity-head { fill: #eef1f2; stroke-dasharray: 7 5; }
    .legend-box { fill: #fbfcfc; stroke: #d7dfe2; }
    .legend-title { fill: #344851; font-size: 13px; font-weight: 700; }
    .legend-text { fill: #344851; font-size: 13px; }
    .note-text { fill: #5b482d; font-size: 13px; }
    @media (max-width: 600px) { main { width: calc(100% - 1rem); padding-top: .75rem; } }
    @page { size: landscape; margin: .35in; }
    @media print {
      :root, body { background: white; }
      main { width: 100%; padding: 0; }
      .page-head { padding: .2in .3in .1in; }
      .diagram-frame { overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
      svg { min-width: 0 !important; }
      .page-head nav { display: none; }
    }
  </style>
</head>

      <h1>Current Music Catalog ERD</h1>
      <nav aria-label="Related pages">
        <button type="button" onclick="window.print()">Save as PDF</button>
        <a href="current-catalog.dbml" download>Download DBML source</a>
      </nav>
      <p>Eight implemented catalog tables. Connectors show the foreign-key relationships and cardinalities defined by the PostgreSQL DDL in <code>load_postgres.py</code>.</p>
