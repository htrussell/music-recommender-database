services:
  frontend:
    image: nginx:alpine
    container_name: music-recommender-web
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - music-network
    depends_on:
      ai-api:
        condition: service_healthy

  ai-api:
    build:
      context: ./backend
    container_name: music-recommender-ai-api
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: lfm2.5-thinking:latest
      OLLAMA_CHAT_MODEL: hf.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M
      OLLAMA_SQL_MODEL: qwen2.5-coder:1.5b
      DUCKDB_URL: http://duckdb:8001
      MUSIC_ADMIN_DSN: dbname=track-db user=airflow password=airflow host=postgres port=5432
      MUSIC_READER_PASSWORD: ${MUSIC_READER_PASSWORD:-music_reader_local_dev}
    networks:
      - music-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      duckdb:
        condition: service_started
      ollama-model:
        condition: service_completed_successfully

  duckdb:
    build:
      context: ./backend
    container_name: music-recommender-duckdb
    command: ["uvicorn", "duckdb_service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MUSIC_DATA_DIR: /data/transformed
    volumes:
      - ./transformed:/data/transformed:ro
    networks:
      - music-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: music-namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=music-hadoop
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_namenode_name_dir=file:///hadoop/dfs/name
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_replication=2
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./data:/data
    networks:
      - music-network

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: music-datanode1
    hostname: datanode1
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - datanode1-data:/hadoop/dfs/data
    networks:
      - music-network
    depends_on:
      - namenode

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: music-datanode2
    hostname: datanode2
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - datanode2-data:/hadoop/dfs/data
    networks:
      - music-network
    depends_on:
      - namenode

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: music-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - music-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: music-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - music-network
    depends_on:
      - zookeeper

  spark-master:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: music-spark-master
    hostname: spark-master
    command: /usr/local/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "18080:8080"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/notebooks
      - ./scripts:/home/jovyan/scripts
      - ./transformed:/home/jovyan/transformed
    networks:
      - music-network

  spark-worker:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: music-spark-worker
    hostname: spark-worker
    command: /usr/local/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "18081:8081"
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_DIR=/tmp/spark-worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/notebooks
      - ./scripts:/home/jovyan/scripts
      - ./transformed:/home/jovyan/transformed
    networks:
      - music-network
    depends_on:
      - spark-master

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: music-jupyter
    hostname: jupyter
    ports:
      - "8888:8888"
      - "14040:4040"
    environment:
      - JUPYTER_TOKEN=spark
      - PYSPARK_SUBMIT_ARGS=--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0 --master spark://spark-master:7077 pyspark-shell
    command: >
      bash -c "pip install kafka-python &&
               start-notebook.sh --NotebookApp.token='spark'"
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./data:/home/jovyan/data
      - ./scripts:/home/jovyan/scripts
      - ./transformed:/home/jovyan/transformed
    networks:
      - music-network
    depends_on:
      - spark-master
      - kafka

  postgres:
    image: postgres:15
    container_name: airflow-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: track-db
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - music-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d track-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  data-loader:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tools
    volumes:
      - ./transformed:/app/transformed:ro
    networks:
      - music-network
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: music-ollama
    hostname: ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-model:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      ollama pull lfm2.5-thinking:latest &&
      ollama pull hf.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M &&
      ollama pull qwen2.5-coder:1.5b
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - music-network
    depends_on:
      ollama:
        condition: service_healthy

networks:
  music-network:
    driver: bridge

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  postgres-data:
  ollama-data: